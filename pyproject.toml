[project]
name = "llm-judge"
version = "0.2.0"
description = "LLM evaluation pipeline: inference → autocheck → judge → compare"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "evaluation", "llm-as-a-judge", "pairwise", "nlp", "openai", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/archminor/llm-judge"
Issues = "https://github.com/archminor/llm-judge/issues"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "httpx>=0.25",
    "python-dotenv>=1.0",
]

[project.scripts]
llm-judge = "llm_judge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_judge"]
