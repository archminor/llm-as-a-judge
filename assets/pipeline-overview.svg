<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="860" height="520" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="430" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">LLM-as-a-Judge Evaluation Pipeline</text>

  <!-- ─── Stage 1: Inference ─── -->
  <rect x="30" y="60" width="220" height="190" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="60" width="220" height="32" rx="10" fill="#3b82f6"/>
  <rect x="30" y="82" width="220" height="10" fill="#3b82f6"/>
  <text x="140" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="white">1. Inference</text>

  <text x="140" y="115" text-anchor="middle" font-size="11" fill="#475569">Candidate A (gemini-2.5-flash)</text>
  <rect x="50" y="122" width="180" height="24" rx="4" fill="white" stroke="#bfdbfe"/>
  <text x="140" y="138" text-anchor="middle" font-size="10" fill="#64748b">"Paris is the capital..."</text>

  <text x="140" y="163" text-anchor="middle" font-size="11" fill="#475569">Candidate B (gemini-2.5-pro)</text>
  <rect x="50" y="170" width="180" height="24" rx="4" fill="white" stroke="#bfdbfe"/>
  <text x="140" y="186" text-anchor="middle" font-size="10" fill="#64748b">"The capital of France is..."</text>

  <!-- Autocheck (internal, subtle) -->
  <rect x="55" y="204" width="170" height="32" rx="4" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8" stroke-dasharray="4,2"/>
  <text x="140" y="224" text-anchor="middle" font-size="9" fill="#6b7280">autocheck: format &amp; schema validation</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="160" x2="298" y2="160" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── Stage 2: Judge (3-Layer) ─── -->
  <rect x="300" y="60" width="240" height="340" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="60" width="240" height="32" rx="10" fill="#eab308"/>
  <rect x="300" y="82" width="240" height="10" fill="#eab308"/>
  <text x="420" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="white">2. Judge (LLM-as-a-Judge)</text>

  <!-- Layer 1 -->
  <rect x="316" y="102" width="208" height="72" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="420" y="118" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">Layer 1: Format &amp; Safety</text>
  <text x="420" y="134" text-anchor="middle" font-size="9" fill="#78716c">format_compliance</text>
  <text x="420" y="148" text-anchor="middle" font-size="9" fill="#78716c">harmlessness</text>
  <text x="420" y="165" text-anchor="middle" font-size="8" fill="#dc2626" font-weight="600">gate: critical issue?</text>

  <!-- Arrow L1→L2 -->
  <line x1="420" y1="174" x2="420" y2="184" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Layer 2 -->
  <rect x="316" y="186" width="208" height="96" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="420" y="202" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">Layer 2: Content Quality</text>
  <text x="420" y="218" text-anchor="middle" font-size="9" fill="#78716c">accuracy, faithfulness</text>
  <text x="420" y="232" text-anchor="middle" font-size="9" fill="#78716c">completeness, relevance</text>
  <text x="420" y="246" text-anchor="middle" font-size="9" fill="#78716c">reasoning, citation_quality</text>
  <text x="420" y="272" text-anchor="middle" font-size="8" fill="#475569">{"rationale": "...", "score": 5}</text>

  <!-- Arrow L2→L3 -->
  <line x1="420" y1="282" x2="420" y2="292" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Layer 3 -->
  <rect x="316" y="294" width="208" height="56" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1"/>
  <text x="420" y="310" text-anchor="middle" font-size="10" font-weight="600" fill="#854d0e">Layer 3: Expression</text>
  <text x="420" y="326" text-anchor="middle" font-size="9" fill="#78716c">expression_quality</text>
  <text x="420" y="342" text-anchor="middle" font-size="8" fill="#475569">Independent call, no shared context</text>

  <!-- Blinding label -->
  <rect x="316" y="362" width="208" height="24" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="0.8"/>
  <text x="420" y="378" text-anchor="middle" font-size="8.5" fill="#dc2626">Blinding: SHA-256 deterministic order</text>

  <!-- Arrow 2→3 -->
  <line x1="540" y1="230" x2="588" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ─── Stage 3: Compare ─── -->
  <rect x="590" y="60" width="240" height="340" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="590" y="60" width="240" height="32" rx="10" fill="#a855f7"/>
  <rect x="590" y="82" width="240" height="10" fill="#a855f7"/>
  <text x="710" y="82" text-anchor="middle" font-size="13" font-weight="600" fill="white">3. Compare</text>

  <text x="710" y="112" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Win Rate</text>
  <rect x="610" y="118" width="200" height="32" rx="4" fill="white" stroke="#d8b4fe"/>
  <text x="710" y="132" text-anchor="middle" font-size="9" fill="#64748b">gemini-2.5-flash: 40%</text>
  <text x="710" y="144" text-anchor="middle" font-size="9" fill="#64748b">gemini-2.5-pro: 50%  tie: 10%</text>

  <text x="710" y="168" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Mean Scores by Metric</text>
  <rect x="610" y="174" width="200" height="56" rx="4" fill="white" stroke="#d8b4fe"/>
  <text x="710" y="188" text-anchor="middle" font-size="9" fill="#64748b">accuracy:      4.2 vs 4.5</text>
  <text x="710" y="200" text-anchor="middle" font-size="9" fill="#64748b">relevance:     4.8 vs 4.7</text>
  <text x="710" y="212" text-anchor="middle" font-size="9" fill="#64748b">faithfulness:  4.6 vs 4.8</text>
  <text x="710" y="224" text-anchor="middle" font-size="9" fill="#94a3b8">...</text>

  <text x="710" y="248" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Confidence Intervals</text>
  <rect x="610" y="254" width="200" height="26" rx="4" fill="white" stroke="#d8b4fe"/>
  <text x="710" y="271" text-anchor="middle" font-size="9" fill="#64748b">95% CI [3.8, 4.6]</text>

  <text x="710" y="298" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Judge Agreement</text>
  <rect x="610" y="304" width="200" height="22" rx="4" fill="white" stroke="#d8b4fe"/>
  <text x="710" y="319" text-anchor="middle" font-size="9" fill="#64748b">93.3%</text>

  <text x="710" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Notable Failures</text>
  <rect x="610" y="354" width="200" height="32" rx="4" fill="white" stroke="#d8b4fe"/>
  <text x="710" y="368" text-anchor="middle" font-size="9" fill="#64748b">tc-004: Invalid JSON</text>
  <text x="710" y="380" text-anchor="middle" font-size="8" fill="#94a3b8">(from autocheck)</text>

  <!-- ─── Bottom: Key Features ─── -->
  <rect x="30" y="430" width="800" height="76" rx="8" fill="white" stroke="#e2e8f0"/>
  <text x="430" y="452" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Key Features</text>

  <rect x="44" y="462" width="108" height="22" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="0.8"/>
  <text x="98" y="477" text-anchor="middle" font-size="9" fill="#2563eb">Multi-vendor LLM</text>

  <rect x="162" y="462" width="108" height="22" rx="11" fill="#fefce8" stroke="#eab308" stroke-width="0.8"/>
  <text x="216" y="477" text-anchor="middle" font-size="9" fill="#a16207">3-Layer Evaluation</text>

  <rect x="280" y="462" width="86" height="22" rx="11" fill="#fef2f2" stroke="#ef4444" stroke-width="0.8"/>
  <text x="323" y="477" text-anchor="middle" font-size="9" fill="#dc2626">Blinding</text>

  <rect x="376" y="462" width="96" height="22" rx="11" fill="#faf5ff" stroke="#a855f7" stroke-width="0.8"/>
  <text x="424" y="477" text-anchor="middle" font-size="9" fill="#7c3aed">Judge Repeats</text>

  <rect x="482" y="462" width="118" height="22" rx="11" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="0.8"/>
  <text x="541" y="477" text-anchor="middle" font-size="9" fill="#0284c7">Markdown Rubrics</text>

  <rect x="610" y="462" width="96" height="22" rx="11" fill="#fff7ed" stroke="#f97316" stroke-width="0.8"/>
  <text x="658" y="477" text-anchor="middle" font-size="9" fill="#ea580c">YAML Config</text>

  <rect x="716" y="462" width="108" height="22" rx="11" fill="#f0fdf4" stroke="#22c55e" stroke-width="0.8"/>
  <text x="770" y="477" text-anchor="middle" font-size="9" fill="#16a34a">Schema Validation</text>
</svg>
