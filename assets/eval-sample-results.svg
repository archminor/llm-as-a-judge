  <text x="260" y="381" text-anchor="middle" font-size="10" fill="#6366f1">0%</text>
  <text x="420" y="381" text-anchor="middle" font-size="10" fill="#06b6d4">100%</text>
  <text x="560" y="381" text-anchor="middle" font-size="10" fill="#64748b">0%</text>
  <text x="690" y="381" text-anchor="middle" font-size="10" font-weight="600" fill="#06b6d4">mini</text>

  <!-- analysis -->
  <text x="120" y="401" text-anchor="middle" font-size="10" fill="#475569">analysis (1)</text>
  <text x="260" y="401" text-anchor="middle" font-size="10" fill="#6366f1">100%</text>
  <text x="420" y="401" text-anchor="middle" font-size="10" fill="#06b6d4">0%</text>
  <text x="560" y="401" text-anchor="middle" font-size="10" fill="#64748b">0%</text>
  <text x="690" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#6366f1">oss-20b</text>

  <!-- extraction -->
  <rect x="40" y="407" width="720" height="20" rx="0" fill="#f8fafc"/>
  <text x="120" y="421" text-anchor="middle" font-size="10" fill="#475569">extraction (1)</text>
  <text x="260" y="421" text-anchor="middle" font-size="10" fill="#6366f1">0%</text>
  <text x="420" y="421" text-anchor="middle" font-size="10" fill="#06b6d4">0%</text>
  <text x="560" y="421" text-anchor="middle" font-size="10" fill="#64748b">100%</text>
  <text x="690" y="421" text-anchor="middle" font-size="10" fill="#64748b">tie</text>

  <!-- report -->
  <text x="120" y="441" text-anchor="middle" font-size="10" fill="#475569">report (1)</text>
  <text x="260" y="441" text-anchor="middle" font-size="10" fill="#6366f1">0%</text>
  <text x="420" y="441" text-anchor="middle" font-size="10" fill="#06b6d4">100%</text>
  <text x="560" y="441" text-anchor="middle" font-size="10" fill="#64748b">0%</text>
  <text x="690" y="441" text-anchor="middle" font-size="10" font-weight="600" fill="#06b6d4">mini</text>

  <!-- creative -->
  <rect x="40" y="447" width="720" height="20" rx="0" fill="#f8fafc"/>
  <text x="120" y="461" text-anchor="middle" font-size="10" fill="#475569">creative (1)</text>
  <text x="260" y="461" text-anchor="middle" font-size="10" fill="#6366f1">0%</text>
  <text x="420" y="461" text-anchor="middle" font-size="10" fill="#06b6d4">100%</text>
  <text x="560" y="461" text-anchor="middle" font-size="10" fill="#64748b">0%</text>
  <text x="690" y="461" text-anchor="middle" font-size="10" font-weight="600" fill="#06b6d4">mini</text>

  <!-- Footer -->
  <line x1="40" y1="480" x2="760" y2="480" stroke="#e2e8f0"/>
  <text x="400" y="500" text-anchor="middle" font-size="10" fill="#94a3b8">Critical issues: gpt-oss-20b (4) | gpt-5.4-mini (2) | Notable failures: 3 testcases with empty output</text>
  <text x="400" y="514" text-anchor="middle" font-size="9" fill="#cbd5e1">Dataset v1</text>
</svg>
