  <text x="365" y="237" text-anchor="end" font-size="10" fill="#475569">relevance</text>
  <rect x="370" y="228" width="259" height="5" rx="2" fill="#6366f1" opacity="0.85"/>
  <rect x="370" y="235" width="322" height="5" rx="2" fill="#06b6d4" opacity="0.85"/>
  <text x="633" y="233" font-size="8" fill="#6366f1">3.7</text>
  <text x="696" y="240" font-size="8" fill="#06b6d4">4.6</text>

