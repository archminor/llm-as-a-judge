<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#0f172a">Evaluation Results — Sample Run</text>
  <text x="400" y="54" text-anchor="middle" font-size="11" fill="#64748b">Judge: gpt-5.4 | 10 testcases | 30 judgements | hybrid mode</text>

  <!-- Legend -->
  <rect x="260" y="66" width="12" height="12" rx="2" fill="#6366f1"/>
  <text x="278" y="77" font-size="11" fill="#334155">gpt-oss-20b</text>
  <rect x="380" y="66" width="12" height="12" rx="2" fill="#06b6d4"/>
  <text x="398" y="77" font-size="11" fill="#334155">gpt-5.4-mini</text>

  <!-- Win Rate Donut (left panel) -->
  <text x="130" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Pairwise Win Rate</text>
  <circle cx="130" cy="180" r="52" fill="none" stroke="#e2e8f0" stroke-width="18"/>
  <!-- gpt-54-mini wins: 60% = 216deg, starting from top (-90deg) -->
  <circle cx="130" cy="180" r="52" fill="none" stroke="#06b6d4" stroke-width="18"
          stroke-dasharray="196.04 130.69" stroke-dashoffset="81.68" transform="rotate(-90 130 180)"/>
  <!-- tie: 30% = 108deg -->
  <circle cx="130" cy="180" r="52" fill="none" stroke="#94a3b8" stroke-width="18"
          stroke-dasharray="98.02 228.71" stroke-dashoffset="-114.35" transform="rotate(-90 130 180)"/>
  <!-- gpt-oss-20b wins: 10% = 36deg -->
  <circle cx="130" cy="180" r="52" fill="none" stroke="#6366f1" stroke-width="18"
          stroke-dasharray="32.67 294.06" stroke-dashoffset="-212.37" transform="rotate(-90 130 180)"/>
  <!-- Center label -->
  <text x="130" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#06b6d4">60%</text>
  <text x="130" y="192" text-anchor="middle" font-size="10" fill="#64748b">mini wins</text>
  <!-- Donut legend -->
  <rect x="60" y="248" width="8" height="8" rx="1" fill="#06b6d4"/>
  <text x="73" y="256" font-size="10" fill="#475569">Win 60%</text>
  <rect x="120" y="248" width="8" height="8" rx="1" fill="#94a3b8"/>
  <text x="133" y="256" font-size="10" fill="#475569">Tie 30%</text>
  <rect x="172" y="248" width="8" height="8" rx="1" fill="#6366f1"/>
  <text x="185" y="256" font-size="10" fill="#475569">Lose 10%</text>

  <!-- Per-metric bar chart (right panel) -->
  <text x="500" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Mean Score by Metric (1-5)</text>

  <!-- Grid lines -->
  <line x1="370" y1="125" x2="370" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="440" y1="125" x2="440" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="510" y1="125" x2="510" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="580" y1="125" x2="580" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="650" y1="125" x2="650" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <line x1="720" y1="125" x2="720" y2="270" stroke="#e2e8f0" stroke-width="0.5"/>
  <!-- Scale labels -->
