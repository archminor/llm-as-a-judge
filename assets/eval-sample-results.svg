  <text x="440" y="282" text-anchor="middle" font-size="9" fill="#94a3b8">1</text>
  <text x="510" y="282" text-anchor="middle" font-size="9" fill="#94a3b8">2</text>
  <text x="580" y="282" text-anchor="middle" font-size="9" fill="#94a3b8">3</text>
  <text x="650" y="282" text-anchor="middle" font-size="9" fill="#94a3b8">4</text>
  <text x="720" y="282" text-anchor="middle" font-size="9" fill="#94a3b8">5</text>

