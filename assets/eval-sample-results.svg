  <rect x="370" y="252" width="253" height="6" rx="2" fill="#6366f1"/>
  <rect x="370" y="260" width="309" height="6" rx="2" fill="#06b6d4"/>
  <text x="627" y="258" font-size="9" font-weight="600" fill="#6366f1">3.62</text>
  <text x="683" y="266" font-size="9" font-weight="600" fill="#06b6d4">4.42</text>

  <!-- Task breakdown table -->
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Win Rate by Task Type</text>

  <!-- Table header -->
  <rect x="40" y="322" width="720" height="24" rx="4" fill="#e2e8f0"/>
  <text x="120" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Task</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">gpt-oss-20b</text>
  <text x="420" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">gpt-5.4-mini</text>
  <text x="560" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Tie</text>
  <text x="690" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">Winner</text>

  <!-- qa -->
  <text x="120" y="360" text-anchor="middle" font-size="10" fill="#475569">qa (4)</text>
  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#6366f1">0%</text>
  <text x="420" y="360" text-anchor="middle" font-size="10" fill="#06b6d4">50%</text>
  <text x="560" y="360" text-anchor="middle" font-size="10" fill="#64748b">50%</text>
  <text x="690" y="360" text-anchor="middle" font-size="10" font-weight="600" fill="#06b6d4">mini</text>

