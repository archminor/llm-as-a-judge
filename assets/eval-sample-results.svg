  <rect x="370" y="155" width="319" height="5" rx="2" fill="#06b6d4" opacity="0.85"/>
  <text x="662" y="153" font-size="8" fill="#6366f1">4.11</text>
  <text x="693" y="160" font-size="8" fill="#06b6d4">4.56</text>

