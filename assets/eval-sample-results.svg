  <rect x="370" y="215" width="322" height="5" rx="2" fill="#06b6d4" opacity="0.85"/>
  <text x="633" y="213" font-size="8" fill="#6366f1">3.7</text>
  <text x="696" y="220" font-size="8" fill="#06b6d4">4.6</text>

